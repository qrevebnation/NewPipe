[package]
name = "nanopipe-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"

[dependencies]
rustypipe = { version = "0.11", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
# Android: rquickjs-sys ships no aarch64-linux-android bindings; enable bindgen to generate them.
rquickjs = { version = "0.9", default-features = false, features = ["bindgen"] }
